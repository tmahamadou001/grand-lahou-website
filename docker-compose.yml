services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-grandlahou}
      MARIADB_USER: ${DB_USER:-grandlahou}
      MARIADB_PASSWORD: ${DB_PASSWORD:-grandlahou}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-grandlahou}
      WORDPRESS_DB_USER: ${DB_USER:-grandlahou}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-grandlahou}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      # Only our own code is version-controlled; WordPress core stays in the volume.
      - ./wp-content/themes/grand-lahou:/var/www/html/wp-content/themes/grand-lahou
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads

  # WP-CLI, for installing WordPress and seeding demo content.
  # Run with: docker compose run --rm cli wp <command>
  cli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-grandlahou}
      WORDPRESS_DB_USER: ${DB_USER:-grandlahou}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-grandlahou}
    volumes:
      - ./wp-content/themes/grand-lahou:/var/www/html/wp-content/themes/grand-lahou
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./tools:/tools
    user: "33:33"

volumes:
  db_data:
  wp_core:
  wp_uploads:
